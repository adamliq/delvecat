# Points the dev universal forwarder at the dev Splunk acting as Deployment Server.
# Copied in by:  docker compose -f deploy/docker-compose.yml cp \
#   deploy/forwarder/deploymentclient.conf forwarder:/opt/splunkforwarder/etc/system/local/
[deployment-client]
phoneHomeIntervalInSecs = 30

[target-broker:deploymentServer]
targetUri = splunk:8089
