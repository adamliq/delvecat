# Local Splunk Enterprise for developing connectors against a live instance.
#   SPLUNK_PASSWORD='change-me-1234' docker compose -f deploy/docker-compose.yml up -d
# Web UI: http://localhost:8000   Management API: https://localhost:8089
services:
  splunk:
    image: splunk/splunk:9.4
    platform: linux/amd64
    environment:
      SPLUNK_START_ARGS: --accept-license
      SPLUNK_GENERAL_TERMS: --accept-sgt-current-at-splunk-com
      SPLUNK_PASSWORD: ${SPLUNK_PASSWORD:?set SPLUNK_PASSWORD}
    ports:
      - "8000:8000"
      - "8089:8089"
    volumes:
      - splunk-var:/opt/splunk/var
volumes:
  splunk-var:
