# Local Splunk for developing connectors against live instances.
#   SPLUNK_PASSWORD='change-me-1234' docker compose -f deploy/docker-compose.yml up -d
#   # optional universal forwarder managed by the Deployment Server:
#   SPLUNK_PASSWORD=... docker compose -f deploy/docker-compose.yml --profile forwarder up -d
# Web UI: http://localhost:8000   Management API: https://localhost:8089
services:
  splunk:
    image: splunk/splunk:9.4
    platform: linux/amd64
    hostname: splunk
    environment:
      SPLUNK_START_ARGS: --accept-license
      SPLUNK_GENERAL_TERMS: --accept-sgt-current-at-splunk-com
      SPLUNK_PASSWORD: ${SPLUNK_PASSWORD:?set SPLUNK_PASSWORD}
    ports:
      - "8000:8000"
      - "8089:8089"
    volumes:
      - splunk-var:/opt/splunk/var
      # Deployment apps served by this instance acting as a Deployment Server.
      - ./deployment-apps:/opt/delvecat-deployment-apps:ro

  forwarder:
    profiles: [forwarder]
    image: splunk/universalforwarder:9.4
    platform: linux/amd64
    hostname: uf-linux-01
    environment:
      SPLUNK_START_ARGS: --accept-license
      SPLUNK_GENERAL_TERMS: --accept-sgt-current-at-splunk-com
      SPLUNK_PASSWORD: ${SPLUNK_PASSWORD:?set SPLUNK_PASSWORD}
      # Not honoured by every image version; see deploy/forwarder/deploymentclient.conf.
      SPLUNK_DEPLOYMENT_SERVER: splunk:8089
    depends_on:
      - splunk

volumes:
  splunk-var:
