name: Splunk app
# Builds the DelveCat Splunk app packages, checks them with Splunk AppInspect
# (Splunk Cloud checks) and attaches them to the run. A tag v<version> matching
# splunk-app/delvecat/default/app.conf also publishes them as a GitHub release.
on:
  push:
    branches: [main, "claude/**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
        working-directory: web
      - id: version
        run: echo "version=$(sed -n 's/^version = //p' splunk-app/delvecat/default/app.conf | head -1)" >> "$GITHUB_OUTPUT"
      - run: make splunk-app
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install splunk-appinspect==4.4.0
      - name: AppInspect (Splunk Cloud checks)
        run: |
          status=0
          for pkg in dist/delvecat-*.tgz; do
            report="${pkg%.tgz}-appinspect.json"
            splunk-appinspect inspect "$pkg" --mode precert --included-tags cloud \
              --output-file "$report" --data-format json > /dev/null
            python3 - "$pkg" "$report" <<'EOF' || status=1
          import json, sys
          pkg, path = sys.argv[1:]
          report = json.load(open(path))["reports"][0]
          print(f"{pkg}: {report['summary']}")
          # The legacy package is for Splunk 9.x to 10.3 on premises, not Splunk Cloud:
          # Splunk 9.x has only Python 3.9, which AppInspect no longer accepts.
          known = {"check_commands_conf_python_required"} if "-legacy" in pkg else set()
          bad = 0
          for group in report["groups"]:
              for check in group["checks"]:
                  if check["result"] in ("failure", "error", "warning"):
                      if check["name"] in known:
                          print(f"::warning title={check['name']}::{pkg}: expected (Python 3.9)")
                          continue
                      level = "error" if check["result"] != "warning" else "warning"
                      msg = check["messages"][0]["message"] if check["messages"] else ""
                      print(f"::{level} title={check['name']}::{pkg}: {msg[:400]}")
                      bad += check["result"] != "warning"
          sys.exit(1 if bad else 0)
          EOF
          done
          exit $status
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: delvecat-splunk-app-${{ steps.version.outputs.version }}
          path: |
            dist/delvecat-*.tgz
            dist/delvecat-*-appinspect.json

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: package
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Tag matches the app version
        run: |
          if [ "${GITHUB_REF_NAME}" != "v${{ needs.package.outputs.version }}" ]; then
            echo "::error::Tag ${GITHUB_REF_NAME} does not match app.conf version ${{ needs.package.outputs.version }}"
            exit 1
          fi
      - uses: actions/download-artifact@v4
        with:
          name: delvecat-splunk-app-${{ needs.package.outputs.version }}
          path: dist
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --title "DelveCat $GITHUB_REF_NAME" \
            --notes "Splunk app packages. delvecat-${{ needs.package.outputs.version }}.tgz: Splunk Enterprise 10.4+ and Splunk Cloud. delvecat-${{ needs.package.outputs.version }}-legacy.tgz: Splunk Enterprise 9.x to 10.3. Install and set up: splunk-app/README.md." \
            dist/delvecat-*.tgz
