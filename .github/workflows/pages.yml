# Deploys the web app with the DEMO bundle built from fixtures.
# Never point this workflow at real Splunk data unless Pages access is restricted
# (see docs/PLAN.md §2, "Privacy on GitHub Pages").
name: Deploy demo to GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Build demo catalog (merged, redacted for public hosting)
        env:
          DELVECAT_REDACT_SALT: delvecat-demo  # not a secret: keeps demo pseudonyms stable
        run: |
          (cd ingestion && uv sync --locked)
          make demo ANNOTATION_REPO="${{ github.server_url }}/${{ github.repository }}" \
            ANNOTATION_BRANCH="${{ github.ref_name }}" REDACT="--redact-profile public"
      - name: Build site
        working-directory: web
        run: npm ci && npm run build
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: web/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
