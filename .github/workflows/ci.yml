name: CI
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  ingestion:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ingestion
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --locked
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run pytest -q
      - name: Build demo catalog (four instances, merged)
        working-directory: .
        run: make demo
      - run: uv run delvecat-ingest validate ../web/public/catalog
      - name: Public redaction of the demo validates
        env:
          DELVECAT_REDACT_SALT: ci
        run: |
          uv run delvecat-ingest redact ../web/public/catalog --redact-profile public --out /tmp/public.json
          uv run delvecat-ingest validate /tmp/public.json
      - name: Annotations are valid and all match an object
        run: uv run delvecat-ingest lint-annotations ../annotations --bundle ../web/public/catalog
      - uses: actions/upload-artifact@v4
        with:
          name: demo-catalog
          path: web/public/catalog

  # The Splunk app runs ingestion on Splunk 9.x's Python 3.9.
  ingestion-python39:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ingestion
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --locked --python 3.9
      - run: uv run --python 3.9 pytest -q

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - name: Generated types are up to date
        run: npm run gen:types && git diff --exit-code src/generated
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
