[project]
name = "delvecat-ingest"
version = "0.1.0"
description = "Read-only metadata extraction from Splunk into DelveCat catalog bundles"
readme = "README.md"
requires-python = ">=3.9"  # Splunk 9.x bundles Python 3.9
license = "Apache-2.0"
dependencies = [
  "defusedxml>=0.7.1",
  "httpx>=0.27",
  "jsonschema>=4.23",
  "pyyaml>=6.0.3",
]

[project.scripts]
delvecat-ingest = "delvecat_ingest.cli:main"

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.6"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/delvecat_ingest"]

[tool.ruff]
line-length = 100
target-version = "py39"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
