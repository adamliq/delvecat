glossary:
  - term: Storefront
    description: The public e-commerce site customers buy from. Its web servers send access logs to the web index.
    synonyms: [shop, web store]
    related: [Summary index]
  - term: Perimeter firewall
    description: The edge firewalls between the corporate network and the internet. They log every allowed and blocked connection.
    synonyms: [edge firewall]
    related: [SOC]
  - term: SOC
    description: Security Operations Center. Owns detection content and responds to security alerts.
    synonyms: [security operations]
  - term: Summary index
    description: An index holding pre-aggregated results written by scheduled searches, so dashboards stay fast.
  - term: Failed logon
    description: A Windows authentication failure (EventCode 4625). Spikes can indicate password spraying.
    related: [SOC]

  # Field-level terms: the fields listed carry the term in every sourcetype,
  # so the same meaning is findable across vendors' names and types.
  - term: Source address
    description: The network address that started the activity. CIM calls it src or src_ip; web servers log it as clientip.
    owner: network-engineering
    fields: [src_ip, src, clientip]
  - term: Destination address
    description: The network address or host that received the activity.
    owner: network-engineering
    fields: [dest_ip, dest]
  - term: Identity
    description: The human or service account responsible for the activity. Formats differ by source (bare name, DOMAIN\user, email).
    owner: soc
    fields: [user, src_user]
  - term: Outcome
    description: Whether the activity was allowed or blocked, succeeded or failed. HTTP status codes count as an outcome.
    owner: soc
    fields: [action, status, reply_code]
  - term: Web request
    description: Attributes of an HTTP request.
    owner: web-platform
    fields: [uri, uri_path, method, http_method, useragent, http_user_agent]
