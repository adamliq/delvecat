# Splunk 9.x to 10.3: Python 3.9 (Splunk 9.x has no other).
# See ../../delvecat/default/restmap.conf for the endpoint.
[script:delvecat_connectivity]
match = /delvecat/connectivity
script = delvecat_connectivity.py
scripttype = persist
handler = delvecat_connectivity.ConnectivityHandler
requireAuthentication = true
output_modes = json
passPayload = true
passSession = true
passHttpHeaders = false
python.version = python3
python.required = 3.9

# POST /services/delvecat/transfer: import a catalog (a file, or read from another stack)
# into this stack's app, combined with its own or replacing it. Publishers and admins.
[script:delvecat_transfer]
match = /delvecat/transfer
script = delvecat_transfer.py
scripttype = persist
handler = delvecat_transfer.TransferHandler
requireAuthentication = true
output_modes = json
passPayload = true
passSession = true
passHttpHeaders = false
python.version = python3
python.required = 3.9

[script:delvecat_catalog]
match = /delvecat/catalog
script = delvecat_catalog.py
scripttype = persist
handler = delvecat_catalog.CatalogHandler
requireAuthentication = true
output_modes = json
passPayload = false
passSession = true
passHttpHeaders = false
python.version = python3
python.required = 3.9

