# Splunk 9.x to 10.3: Python 3.9 (Splunk 9.x has no other).
# See ../../delvecat/default/restmap.conf for the endpoint.
[script:delvecat_connectivity]
match = /delvecat/connectivity
script = delvecat_connectivity.py
scripttype = persist
handler = delvecat_connectivity.ConnectivityHandler
requireAuthentication = true
output_modes = json
passPayload = true
passSession = true
passHttpHeaders = false
python.version = python3
python.required = 3.9
