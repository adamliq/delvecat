# DelveCat: a read-only metadata catalog for Splunk.
# The app shows a catalog built outside Splunk by delvecat-ingest and stored
# with `delvecat-ingest publish` in this app's KV store collection.

[id]
name = delvecat
version = 0.2.0

[package]
id = delvecat
check_for_updates = false

[launcher]
author = DelveCat
description = Browse, search and trace lineage across your Splunk metadata: indexes, sourcetypes, fields, searches, detections, dashboards, roles and more.
version = 0.2.0

[ui]
is_visible = true
label = DelveCat

[install]
state = enabled
