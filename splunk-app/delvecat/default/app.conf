# Licoryx Delvecat: a read-only metadata catalog for Splunk.
# The app shows a catalog built outside Splunk by delvecat-ingest and stored
# with `delvecat-ingest publish` in this app's KV store collection.

[id]
name = delvecat
version = 0.47.0

[package]
id = delvecat
check_for_updates = false

[launcher]
author = Licoryx
description = Browse, search and trace lineage across your Splunk metadata: indexes, sourcetypes, fields, searches, detections, dashboards, roles and more.
version = 0.47.0

[ui]
is_visible = true
label = Licoryx Delvecat

[install]
state = enabled
# Stamped by make splunk-app (the commit time): a new number on every package, so that
# Splunk Web serves the new page after an upgrade instead of the browser's cached one.
build = 1
