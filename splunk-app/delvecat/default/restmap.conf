# POST /services/delvecat/connectivity: test the connection to another stack that has
# the app installed (the Testing page). Read-only on both stacks; publishers and admins
# only (the handler checks the caller's roles). The token in the body is never stored.
[script:delvecat_connectivity]
match = /delvecat/connectivity
script = delvecat_connectivity.py
scripttype = persist
handler = delvecat_connectivity.ConnectivityHandler
requireAuthentication = true
output_modes = json
passPayload = true
passSession = true
passHttpHeaders = false
python.version = python3
