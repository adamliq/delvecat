# POST /services/delvecat/connectivity: test the connection to another stack that has
# the app installed (the Testing page). Read-only on both stacks; publishers and admins
# only (the handler checks the caller's roles). The token in the body is never stored.
[script:delvecat_connectivity]
match = /delvecat/connectivity
script = delvecat_connectivity.py
scripttype = persist
handler = delvecat_connectivity.ConnectivityHandler
requireAuthentication = true
output_modes = json
passPayload = true
passSession = true
passHttpHeaders = false
python.version = python3
python.required = 3.13

# POST /services/delvecat/transfer: import a catalog (a file, or read from another stack)
# into this stack's app, combined with its own or replacing it. Publishers and admins.
[script:delvecat_transfer]
match = /delvecat/transfer
script = delvecat_transfer.py
scripttype = persist
handler = delvecat_transfer.TransferHandler
requireAuthentication = true
output_modes = json
passPayload = true
passSession = true
passHttpHeaders = false
python.version = python3
python.required = 3.13

# GET /services/delvecat/catalog: the published catalog for scripts and other tools
# (objects by type, app or name; one object with its relationships; what an object
# depends on, or what depends on it). Read-only, with the caller's own session, so the
# catalog collection's permissions decide who may use it.
[script:delvecat_catalog]
match = /delvecat/catalog
script = delvecat_catalog.py
scripttype = persist
handler = delvecat_catalog.CatalogHandler
requireAuthentication = true
output_modes = json
passPayload = false
passSession = true
passHttpHeaders = false
python.version = python3
python.required = 3.13

