[delvecatbuild-command]
syntax = delvecatbuild (fields=<bool>)? (usage=<bool>)? (redact=(none|internal))? (instance=<string>)? (instancename=<string>)? (weburl=<string>)? (dryrun=<bool>)? (replacesmaller=<bool>)? (parts=<string>)? (searchtimeout=<int>)? (fieldindexes=<string>)?
shortdesc = Builds the DelveCat catalog of this Splunk and publishes it to the DelveCat app.
description = Reads this Splunk's configuration and usage (read-only, with your permissions) and stores the catalog in the DelveCat app's KV store collection. Needs the delvecat_publisher role. fields=true also samples events to discover fields (slower).
usage = public
example1 = | delvecatbuild
comment1 = Build and publish the catalog.
example2 = | delvecatbuild fields=true redact=internal
comment2 = Also discover fields, and drop personal names.
example3 = | delvecatbuild parts="indexes,inventory,savedSearches" searchtimeout=120
comment3 = Read only these parts, cancelling any search that runs over 2 minutes.
example4 = | delvecatbuild fields=true fieldindexes="web,app_*"
comment4 = Discover fields only for sourcetypes in the web index and indexes starting with app_.
category = generating
appears-in = DelveCat 0.2.0
maintainer = DelveCat
