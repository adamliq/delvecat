# Builds and publishes the catalog on a schedule. Off until turned on from the Build page
# (Licoryx Delvecat > Build > Schedule), which also sets the parts, options and time.
[Licoryx Delvecat - scheduled build]
search = | delvecatbuild
description = Builds the Licoryx Delvecat catalog of this Splunk and publishes it. Set it up on the app's Build page.
cron_schedule = 17 2 * * *
enableSched = 1
disabled = 1
dispatch.earliest_time = -1m
dispatch.latest_time = now
schedule_window = auto
alert.track = 0
