# The published catalog: gzip-compressed JSON, base64-encoded, split into parts.
#   _key "current"            -> {generation, parts, sha256, bytes, encoding, publishedAt, ...}
#   _key "<generation>-<n>"   -> {generation, part, data}
# Written only by `delvecat-ingest publish` (role delvecat_publisher), read by the
# app page (role delvecat_user). See metadata/default.meta.
[delvecat_catalog]
replicate = false

# Health findings someone accepted or snoozed, shared by everyone who uses the app:
#   _key "ack-<hash of object id and check>" -> {entity, check, state, until, status, note, by, at}
# Written from the Health page by delvecat_publisher and admins; see metadata/default.meta.
[delvecat_acks]
replicate = false

# SQL queries shared with everyone who uses the app (the SQL console's Saved tab):
#   _key "q-<hash of the name>" -> {name, sql, by, at}
# Written from the SQL console by delvecat_publisher and admins; see metadata/default.meta.
[delvecat_queries]
replicate = false
