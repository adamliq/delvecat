# The published catalog: gzip-compressed JSON, base64-encoded, split into parts.
#   _key "current"            -> {generation, parts, sha256, bytes, encoding, publishedAt, ...}
#   _key "<generation>-<n>"   -> {generation, part, data}
# Written only by `delvecat-ingest publish` (role delvecat_publisher), read by the
# app page (role delvecat_user). See metadata/default.meta.
[delvecat_catalog]
replicate = false
